# ARM UI OpenSpec Specification

spec_version: "1.0"
name: "@hscsg/arm-ui"
version: "0.1.0"
description: "ARM UI - React visual CRM with Clear v2 design system. Semantic CSS tokens, violet reserved for agent work."

domain:
  entities:
    - name: ARMApp
      description: "Main React application with routing and context providers"
      fields:
        - name: workspaceDir
          type: string
          required: false
          description: "Folder mode: path to workspace. Browser mode: null"

    - name: DesignTokens
      description: "Semantic CSS tokens for product concepts"
      fields:
        - name: account
          type: string
          description: "Account-related surfaces"
        - name: signal
          type: string
          description: "Pattern/signal highlights"
        - name: highlight
          type: string
          description: "General highlights"
        - name: agent
          type: string
          description: "Agent work (violet) - RESERVED"
        - name: success
          type: string
          description: "Success states"
        - name: warning
          type: string
          description: "Warning states"
        - name: destructive
          type: string
          description: "Destructive actions"

    - name: Views
      description: "Page-level view components"
      fields:
        - name: HomeView
          type: string
          description: "Dashboard: what's due, what moved, agent proposals waiting"
        - name: BookView
          type: string
          description: "All accounts by stage lane with one thing worth noticing; filterable by what's thin"
        - name: AccountsView
          type: string
          description: "List and table of all accounts"
        - name: AccountView
          type: string
          description: "Single account: claims, contacts, deals, tasks, notes, trace"
        - name: PipelineView
          type: string
          description: "Deal pipeline by stage"
        - name: CallsView
          type: string
          description: "Import and review call transcripts"
        - name: ReviewView
          type: string
          description: "Approve/reject agent proposals"
        - name: TraceView
          type: string
          description: "Source-to-action chain from any record"
        - name: SettingsView
          type: string
          description: "Workspace settings, agent mode, export/import"

    - name: Components
      description: "Reusable UI components"
      fields:
        - name: AccountCard
          type: string
          description: "Account summary card for list/book views"
        - name: AccountTable
          type: string
          description: "Sortable comparison table (unknowns never sort up)"
        - name: ClaimList
          type: string
          description: "Claims with grounding indicators (solid/dashed underline)"
        - name: PatternList
          type: string
          description: "Cross-account patterns with shared terms and sources"
        - name: ProposalReview
          type: string
          description: "Review pane for agent proposals"
        - name: Trace
          type: string
          description: "Upstream sources and downstream dependents"

operations:
  - name: dev
    description: "Start dev server (browser mode, localStorage)"
    input: "DevOptions"
    output: "DevServer"

  - name: build
    description: "Build production bundle for folder mode"
    input: "BuildOptions"
    output: "BuildOutput"

functions:
  - name: App
    module: "App"
    description: "Main app component: router, sidebar, context providers, mode detection"

  - name: useWorkspace
    module: "hooks"
    description: "Hook for workspace data: folder mode (API) or browser mode (localStorage)"

  - name: useArmCore
    module: "hooks"
    description: "Hook for arm-core functions: memory, brief, patterns, lint, trace"

  - name: tokens.css
    module: "tokens.css"
    description: "Semantic CSS tokens. Violet = agent. Use tokens, avoid one-off colors."

  - name: brand
    module: "lib/brand"
    description: "Product name: 'ARM' / 'HSCSG ARM' in full. Single source of truth."

invariants:
  - "Clear v2 design system: cool neutral, Inter display, tabular nums, teal accent, violet=agent"
  - "Semantic tokens only: account, signal, highlight, agent, success, warning, destructive"
  - "Violet RESERVED for agent work (proposals, agent-origin records, agent badges)"
  - "Two modes: Browser (localStorage, one-way Markdown export) / Folder (API + SSE)"
  - "Folder mode: same bundle served by arm-api, marked folder-backed, loads workspace.json via API"
  - "All record IDs visible in backticks for citation"
  - "Generated views show 'Generated by ARM' notice"
  - "Agent-origin records show agent badge with name"
  - "Proposals appear in Review view in real-time via SSE"
  - "Trace view opens from any task, claim, or note"
  - "ARM branding throughout (not Zentrik/Open CRM)"

interfaces:
  - name: ARMUIConsumer
    description: "End users (people) and agents (via arm-api SSE)"
    required_functions:
      - "App"
      - "All view components"
      - "Token system"

traceability:
  - requirement: "ARM-001"
    description: "One write path"
    implements: ["UI submits operations via API -> actions.change -> core.applyChange"]
  - requirement: "ARM-002"
    description: "Every fact shows its source"
    implements: ["ClaimList grounding indicators", "TraceView", "AccountView evidence links"]
  - requirement: "ARM-003"
    description: "Nothing lands unapproved"
    implements: ["ReviewView for proposals", "Real-time SSE updates", "Approve/reject actions"]
  - requirement: "ARM-004"
    description: "Records are user-owned"
    implements: ["Folder mode loads user's workspace.json", "Browser mode exports Markdown snapshot"]
  - requirement: "ARM-005"
    description: "Amphibious monetary layer"
    implements: ["valueDual for dual-mode display", "/agencia screen for mode switching"]

testing:
  unit:
    - "components.test.tsx: rendering with tokens, agent badge, grounding indicators"
    - "hooks.test.ts: useWorkspace folder/browser modes, useArmCore function binding"
  integration:
    - "UI + arm-api + arm-core round-trip: create note -> claim -> task -> proposal -> approve"
    - "SSE: external write broadcasts -> UI updates in real-time"
    - "Mode switch: review <-> direct updates UI immediately"
  e2e:
    - "playwright: browser mode (localStorage) full workflow"
    - "playwright: folder mode (arm ui) + agent MCP -> Review -> approve -> verify"
    - "playwright: pattern detection -> signals bundle export -> share-safe"
    - "playwright: /agencia screen toggles monetary mode labels"